<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Beverly</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f700ff;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #intro-container {
            text-align: center;
            position: absolute;
            z-index: 10;
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
        }

        #inputBox input {
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            text-align: center;
            outline: none;
            margin-bottom: 15px;
            display: block;
            width: 250px;
        }
        
        #inputBox button {
            padding: 10px 25px;
            font-size: 16px;
            cursor: pointer;
            background-color: #66cccc;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            transition: 0.3s;
        }

        #inputBox button:hover {
            background-color: #87ceeb;
        }

        #message {
            font-size: 28px;
            color: #ffffff;
            display: none;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            text-align: center;
            line-height: 1.6;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        canvas {
            display: none;
            background-color: #f700ff; 
            border-radius: 10px;
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>

    <!-- Pemutar Lagu -->
    <audio id="bgMusic" loop>
        <source src="lagubev.mp3" type="audio/mpeg">
    </audio>

    <div id="intro-container">
        <div id="inputBox">
            <input type="text" id="nameInput" placeholder="enter ur name" autocomplete="off">
            <button id="startBtn">Enter</button>
        </div>
        <div id="message"></div>
    </div>

    <canvas id="myCanvas" width="900" height="800"></canvas>

    <script>
        const introContainer = document.getElementById('intro-container');
        const inputBox = document.getElementById('inputBox');
        const nameInput = document.getElementById('nameInput');
        const startBtn = document.getElementById('startBtn');
        const messageDiv = document.getElementById('message');
        const canvas = document.getElementById('myCanvas');
        const ctx = canvas.getContext('2d');
        const bgMusic = document.getElementById('bgMusic');

        startBtn.addEventListener('click', () => {
            bgMusic.play();
            const name = nameInput.value || "kamu";
            inputBox.style.display = 'none';
            messageDiv.style.display = 'block';
            
            setTimeout(() => {
                messageDiv.innerHTML = `hai ${name},<br>this is special gift from me`;
                messageDiv.style.opacity = 1;
            }, 500);

            setTimeout(() => { messageDiv.style.opacity = 0; }, 3500);

            setTimeout(() => {
                messageDiv.innerHTML = "hope u like this...";
                messageDiv.style.opacity = 1;
            }, 5000);

            setTimeout(() => { messageDiv.style.opacity = 0; }, 8000);

            setTimeout(() => {
                introContainer.style.display = 'none';
                mulaiAnimasiKue();
            }, 9500);
        });

        const sleep = ms => new Promise(r => setTimeout(r, ms));

        async function mulaiAnimasiKue() {
            canvas.style.display = 'block';
            ctx.lineWidth = 3;

            const colors = {
                light_green: "#c5e8c8", medium_green: "#a3d2a7", light_yellow: "#f7e8aa", cream: "#fffceb", off_white: "#fffdf4", 
                brown: "#8b5a2b", dark_brown: "#5e4425", orange: "#ffa500", golden_yellow: "#ffb732", teal: "#66cccc", 
                flame_orange: "#ff6600", sky_blue: "#87ceeb", light_steel: "#b0c4de"
            };

            const OX = 450; 
            const OY = 600; 

            function cx(x) { return OX + x; }
            function cy(y) { return OY - y; } 
            function ex(w, a) { return w * Math.cos(a * Math.PI / 180); }
            function ey(h, a) { return h * Math.sin(a * Math.PI / 180); }

            function drawEllipseFull(w, h, outline, fill, yOff) {
                ctx.strokeStyle = outline; ctx.fillStyle = fill;
                ctx.beginPath();
                for(let deg=0; deg<=360; deg++) ctx.lineTo(cx(ex(w, deg)), cy(ey(h, deg) + yOff));
                ctx.fill(); ctx.stroke();
            }

            // 1. PIRING KUE
            ctx.strokeStyle = "white"; ctx.fillStyle = colors.medium_green;
            ctx.beginPath();
            ctx.moveTo(cx(150), cy(0));
            for(let deg=0; deg>=-180; deg--) ctx.lineTo(cx(ex(150, deg)), cy(ey(70, deg)));
            for(let deg=-180; deg<=0; deg++) ctx.lineTo(cx(ex(150, deg)), cy(ey(60, deg)));
            ctx.fill(); ctx.stroke();
            drawEllipseFull(150, 60, "white", colors.light_green, 0);
            
            await sleep(600);

            // 2. TINGKAT 1
            ctx.strokeStyle = colors.light_steel; ctx.fillStyle = colors.light_yellow;
            ctx.beginPath();
            ctx.moveTo(cx(120), cy(70));
            ctx.lineTo(cx(120), cy(0));
            for(let deg=0; deg>=-180; deg--) ctx.lineTo(cx(ex(120, deg)), cy(ey(48, deg)));
            ctx.lineTo(cx(-120), cy(70));
            for(let deg=-180; deg<=0; deg++) ctx.lineTo(cx(ex(120, deg)), cy(ey(48, deg) + 70));
            ctx.fill(); ctx.stroke();
            drawEllipseFull(120, 48, colors.light_steel, colors.light_yellow, 70);
            drawEllipseFull(110, 44, colors.cream, colors.cream, 70);

            await sleep(600);

            // 3. FROSTING BIRU
            ctx.strokeStyle = colors.sky_blue; ctx.fillStyle = colors.sky_blue;
            ctx.beginPath();
            ctx.moveTo(cx(120), cy(0));
            for(let deg=0; deg>=-180; deg--) ctx.lineTo(cx(ex(120, deg)), cy(ey(48, deg) + 10));
            for(let deg=-180; deg<=0; deg++) ctx.lineTo(cx(ex(120, deg)), cy(ey(48, deg)));
            ctx.fill(); ctx.stroke();

            ctx.strokeStyle = colors.light_steel; ctx.fillStyle = colors.light_steel;
            ctx.beginPath();
            ctx.moveTo(cx(120), cy(70));
            for(let i=0; i<=1800; i++) {
                let deg = -0.1 * i;
                let drip = Math.abs(Math.sin(i * Math.PI / 180)) * 15;
                ctx.lineTo(cx(ex(120, deg)), cy(ey(48, deg) + 70 - drip));
            }
            for(let deg=-180; deg<=0; deg++) ctx.lineTo(cx(ex(120, deg)), cy(ey(48, deg) + 70));
            ctx.fill(); ctx.stroke();

            await sleep(600);

            // 4. TINGKAT 2
            ctx.strokeStyle = colors.dark_brown; ctx.fillStyle = colors.brown;
            ctx.beginPath();
            ctx.moveTo(cx(80), cy(120));
            ctx.lineTo(cx(80), cy(70));
            for(let deg=0; deg>=-180; deg--) ctx.lineTo(cx(ex(80, deg)), cy(ey(32, deg) + 70));
            ctx.lineTo(cx(-80), cy(120));
            for(let deg=-180; deg<=0; deg++) ctx.lineTo(cx(ex(80, deg)), cy(ey(32, deg) + 120));
            ctx.fill(); ctx.stroke();
            drawEllipseFull(80, 32, colors.dark_brown, colors.dark_brown, 120);
            drawEllipseFull(70, 28, colors.orange, colors.orange, 120);

            await sleep(600);

            // 5. FROSTING COKELAT
            ctx.strokeStyle = colors.dark_brown; ctx.fillStyle = colors.dark_brown;
            ctx.beginPath();
            ctx.moveTo(cx(80), cy(120));
            for(let i=0; i<=1800; i++) {
                let deg = -0.1 * i;
                let drip = Math.abs(Math.sin(i * Math.PI / 180)) * 12;
                ctx.lineTo(cx(ex(80, deg)), cy(ey(32, deg) + 120 - drip));
            }
            for(let deg=-180; deg<=0; deg++) ctx.lineTo(cx(ex(80, deg)), cy(ey(32, deg) + 120));
            ctx.fill(); ctx.stroke();

            await sleep(600);

            // 6. LILIN
            function drawCandle(xPos, yBase, h) {
                ctx.strokeStyle = colors.teal; ctx.fillStyle = colors.teal;
                ctx.beginPath();
                ctx.moveTo(cx(xPos+4), cy(yBase+h));
                ctx.lineTo(cx(xPos+4), cy(yBase));
                for(let deg=0; deg>=-180; deg--) ctx.lineTo(cx(ex(4,deg)+xPos), cy(ey(2,deg)+yBase));
                ctx.lineTo(cx(xPos-4), cy(yBase+h));
                for(let deg=-180; deg<=0; deg++) ctx.lineTo(cx(ex(4,deg)+xPos), cy(ey(2,deg)+yBase+h));
                ctx.fill(); ctx.stroke();

                ctx.fillStyle = colors.sky_blue;
                ctx.beginPath(); for(let deg=0; deg<=360; deg++) ctx.lineTo(cx(ex(4,deg)+xPos), cy(ey(2,deg)+yBase+h)); ctx.fill();

                ctx.strokeStyle = "white"; ctx.lineWidth = 2;
                for(let i=1; i<=Math.floor(h/10)-1; i++) {
                    ctx.beginPath();
                    ctx.moveTo(cx(xPos-4), cy(yBase+10*i-3));
                    ctx.lineTo(cx(xPos+4), cy(yBase+10*i+3));
                    ctx.stroke();
                }

                ctx.strokeStyle = "black";
                ctx.beginPath();
                ctx.moveTo(cx(xPos), cy(yBase+h)); ctx.lineTo(cx(xPos), cy(yBase+h+8)); ctx.stroke();

                ctx.strokeStyle = colors.flame_orange; ctx.fillStyle = colors.golden_yellow;
                ctx.beginPath();
                for(let deg=0; deg<=360; deg++) ctx.lineTo(cx(ex(3,deg)+xPos+3), cy(ey(8,deg)+yBase+h+16));
                ctx.fill(); ctx.stroke();
            }

            const candlePositions = [[60, 120, 50], [-60, 120, 50], [0, 130, 50], [30, 110, 50], [-30, 110, 50]];
            for(let pos of candlePositions) {
                drawCandle(pos[0], pos[1], pos[2]);
                await sleep(200);
            }

            await sleep(800);

            // 7. TEKS UCAPAN
            ctx.fillStyle = "#ffffff"; 
            ctx.font = "bold 50px 'Curlz MT', 'Comic Sans MS', cursive";
            ctx.textAlign = "center";
            ctx.fillText("Happy Birthday Beverly!", cx(0), cy(280));

            await sleep(1500); // Kasih jeda 1,5 detik setelah ucapan utama muncul
            ctx.fillStyle = "#ffffff"; // Warna putih abu-abu yang lembut
            ctx.font = "italic 24px 'Comic Sans MS', sans-serif";
            ctx.fillText("make a wish... 🎂", cx(0), cy(220));


            await sleep(5000);
            
            // Teks yang akan ditampilkan
            const teksSurat = [
                "hai bev...,",
                "",
                "happy birthday yaa,",
                "semoga panjang umur, sehat selalu,",
                "dan semua impian u tercapai.",
                "thanks uda mau jadi temen i...",
                "i cuma mau bilang,",
                "i so happy to be ur friend :B.",
                "",
                "Riko:3,"
            ];

            let barisSekarang = 0;
            let karakterSekarang = 0;
            let teksYangSudahDitulis = [];

            function ketikSurat() {
                // Bersihkan layar
                ctx.fillStyle = "#d3dae8";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Gambar kotak surat
                ctx.fillStyle = "#ffffff";
                ctx.shadowBlur = 10;
                ctx.shadowColor = "rgba(0,0,0,0.2)";
                ctx.fillRect(cx(-300), cy(200), 600, 400);

                // Gambar teks yang sudah diketik
                ctx.fillStyle = "#333333";
                ctx.font = "22px 'Futura', sans-serif"; // Font mesin ketik
                ctx.textAlign = "left";

                for (let i = 0; i < teksYangSudahDitulis.length; i++) {
                    ctx.fillText(teksYangSudahDitulis[i], cx(-270), cy(150 - (i * 35)));
                }

                // Logika mengetik
                if (barisSekarang < teksSurat.length) {
                    let teksBarisIni = teksSurat[barisSekarang];
                    
                    if (karakterSekarang < teksBarisIni.length) {
                        let potongan = teksBarisIni.substring(0, karakterSekarang + 1);
                        // Update baris terakhir di array
                        teksYangSudahDitulis[barisSekarang] = potongan;
                        karakterSekarang++;
                    } else {
                        // Pindah ke baris baru
                        barisSekarang++;
                        karakterSekarang = 0;
                        teksYangSudahDitulis[barisSekarang] = "";
                    }
                    
                    // Kecepatan mengetik (semakin kecil angkanya, semakin cepat)
                    setTimeout(ketikSurat, 50); 
                }
            }

            ketikSurat();
            
        }
    </script>
</body>
</html>
